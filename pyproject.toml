[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyplanner"
version = "0.8.0"
description = "Planificador PDDL en Python"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Leontes", email = "josesegmur@ugr.es" }]
dependencies = [
    "jsonschema>=4.23",
    # Programación lineal (HiGHS) del motor temporal: efectos continuos y duraciones no
    # fijas (iteración 3b).
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
]

# Numba para compilar las heurísticas (dispositivo "numba"; "auto" lo usa si está instalado).
fast = [
    "numba>=0.60",
]
# PyTorch para evaluar heurísticas por lotes en CPU o GPU. Para GPUs antiguas (p. ej.
# Maxwell) hay que instalarlo desde el índice cu126; ver README.
gpu = [
    "torch>=2.4",
    "numpy",
]

[project.scripts]
pyplanner = "pyplanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyplanner = ["py.typed", "schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# SciPy no trae anotaciones de tipos.
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Los núcleos de Numba no llevan anotaciones: Numba infiere sus propios tipos.
module = [
    "pyplanner.heuristics.compiled",
    "pyplanner.heuristics.compiled_deadlines",
    "pyplanner.heuristics.compiled_temporal_ff",
    "pyplanner.search.compiled_successors",
]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Numba trae tipos parciales que no entienden las funciones compiladas: se trata como Any.
module = ["numba", "numba.*"]
ignore_missing_imports = true
follow_imports = "skip"
