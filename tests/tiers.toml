description = """
Tiers de PyPlanner: los problemas que el parser y el planificador tienen que resolver en cada
iteración (ver docs/tiers.md). Cada grupo es tier<N>/[<parte>/]<dominio>; el tier es el de
la iteración que introdujo el soporte.
"""
description-en = """
PyPlanner tiers: the problems the parser and the planner must handle at each iteration (see
docs/tiers.md). Each group is tier<N>/[<part>/]<domain>; the tier is the iteration that
introduced the support.
"""

